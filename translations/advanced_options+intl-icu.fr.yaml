advanced_options.modal.confirm.reset.database.body.text.1: Confirmez-vous l'effacement total de vos données et la réinstallation de votre site à zéro ? Il n'y aura aucune possibilité de revenir en arrière
advanced_options.modal.confirm.reset.database.body.text.2: Assurez-vous d'avoir réalisé une sauvegarde de votre base de données pour pouvoir revenir en arrière
