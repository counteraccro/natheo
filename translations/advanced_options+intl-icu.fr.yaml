advanced_options.title.danger.zone: 'Zone de danger'
advanced_options.reload.data.title: 'Réinstallation des données pré-installées'
advanced_options.reload.data.text_1: Permet de réinstaller le site avec les données définies lors de son installation. À n'utiliser que si vous souhaitez réinstaller votre site en conservant uniquement ces données
advanced_options.reload.data.warning: Toutes les données que vous avez créées seront supprimées et remplacées par les données pré-installées, sans retour possible. Les dumps SQL ne seront pas supprimés
advanced_options.reload.data.button: 'Réinstaller les données pré-installées'
