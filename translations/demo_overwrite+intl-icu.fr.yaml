demo_overwrite.tutorial.inactive_text: "Le champ extra vaut null, car config/cms/overwrite.yaml ne surcharge plus l'opération info_get. Remettez l'entrée puis videz le cache."
demo_overwrite.tutorial.intro_text_1: "Une surcharge remplace une partie de Nathéo par votre code. Elle s'applique à une opération de l'API v2 ou aux fichiers Vue du back-office. Les trois parties de ce tutoriel détaillent chaque cas."
demo_overwrite.tutorial.intro_text_2: "Votre code PHP va dans `src/Overwrite/` et vos fichiers Vue dans `assets/overwrite/`. Une mise à jour de Nathéo ne touche pas à ces deux dossiers. Un fichier modifié ailleurs, dans `src/Api/` ou `assets/vue/` par exemple, serait remplacé à la mise à jour suivante."
demo_overwrite.tutorial.intro_text_3: "Il faut connaître Symfony et Vue 3, et disposer d'une installation de développement où lancer `php bin/console` et `yarn`."
demo_overwrite.tutorial.intro_title: 'Avant de commencer'
demo_overwrite.tutorial.live_text: "Cette réponse de `GET /api/v2/info` vient du provider surchargé dans la première partie. Sans la surcharge, son champ `extra` vaut `null`."
demo_overwrite.tutorial.live_title: 'Le résultat'
demo_overwrite.tutorial.module_intro: "Cet écran est lui-même un module ajouté par surcharge. Il repose sur deux fichiers, la déclaration de ses routes côté Vue et sa classe de module côté PHP."
demo_overwrite.tutorial.module_raw_note: "Cet écran affiche le code de ses fichiers grâce aux imports `?raw` de Vite. Un fichier importé ainsi est copié dans `public/build`, lisible sans connexion. Réservez-les à des fichiers sans secret."
demo_overwrite.tutorial.module_step1_text: "Créez un dossier dans `assets/overwrite/vue/Components/Admin/Modules/`, ici `DemoOverwrite`, avec un fichier `module.ts`. Il donne l'identifiant du module, ses domaines de traduction et ses routes. Le composant de chaque route s'importe par `@admin/` et se charge à la première visite. Un `module.ts` qui reprend l'identifiant d'un module de Nathéo le remplace."
demo_overwrite.tutorial.module_step1_title: "Déclarer les routes de l'écran"
demo_overwrite.tutorial.module_step2_text: "La classe va dans `src/Overwrite/Module/`, avec l'attribut `AsAdminModule`. Sa définition fixe le rôle requis, ici `ROLE_SUPER_ADMIN`, et son entrée de menu place l'écran dans le menu Outils. Les champs `route` et `path` de l'entrée reprennent le nom et le chemin de la route du `module.ts`. Sans cette classe, l'adresse de l'écran affiche « Page introuvable »."
demo_overwrite.tutorial.module_step2_title: 'Créer la classe du module'
demo_overwrite.tutorial.module_step3_text: "Les textes de l'écran s'écrivent avec la fonction `t()` et la clé complète, comme `demo_overwrite.screen.title`. La commande `php bin/console translation:extract --force --format=yaml fr` ajoute les nouvelles clés dans `translations/demo_overwrite+intl-icu.fr.yaml`, et de même pour `en` et `es`. Le domaine est listé dans `domains` du `module.ts`, et l'application le charge avant d'afficher l'écran."
demo_overwrite.tutorial.module_step3_title: 'Ajouter les textes'
demo_overwrite.tutorial.module_title: 'Ajouter un écran'
demo_overwrite.tutorial.remove_text: "Supprimez l'entrée `info_get` de `config/cms/overwrite.yaml`, puis les dossiers `src/Overwrite/Api/`, `src/Overwrite/Module/`, `assets/overwrite/` et `tests/Overwrite/` avec les fichiers `translations/demo_overwrite+intl-icu.*.yaml`. Retirez aussi `demo_overwrite` de la constante `DOMAINS` de `tests/Translation/ExtractedKeysTest.php` et de `tests/Translation/TranslationKeyConventionTest.php`. Lancez ensuite `php bin/console cache:clear` et `yarn build`."
demo_overwrite.tutorial.remove_title: "Retirer l'exemple"
demo_overwrite.tutorial.screen_note: "Les composables et le client de l'API ne se surchargent pas de cette façon. Pour changer des données, surchargez l'opération de l'API qui les fournit."
demo_overwrite.tutorial.screen_text_1: "Les fichiers du back-office sont dans `assets/vue/Components/Admin/`. Copiez celui à modifier dans `assets/overwrite/vue/Components/Admin/`, au même chemin, puis modifiez la copie. Une version de `assets/overwrite/vue/Components/Admin/Ui/Form/UiButton.vue` remplace ainsi le bouton dans tout le back-office."
demo_overwrite.tutorial.screen_text_2: "Le remplacement passe par l'alias `@admin/`, utilisé par chaque import entre fichiers du back-office. Un import écrit `@admin/Ui/Form/UiButton.vue` sert votre fichier s'il existe, et celui de Nathéo sinon. Gardez les props et les événements de l'original, car les autres composants continuent de les utiliser."
demo_overwrite.tutorial.screen_text_3: "Relancez ensuite `yarn build`. Avec `yarn dev`, redémarrez le serveur après l'ajout d'un fichier, car Vite garde la résolution des imports en mémoire."
demo_overwrite.tutorial.screen_text_wrap: "Pour réutiliser l'original au lieu de le recopier, importez-le par son chemin complet, comme `@/vue/Components/Admin/Ui/Form/UiButton.vue`. L'alias `@admin/` désignerait votre propre fichier."
demo_overwrite.tutorial.screen_title: 'Remplacer un écran ou un composant'
