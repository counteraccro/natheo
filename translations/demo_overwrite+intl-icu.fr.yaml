demo_overwrite.module.description: "Exemple de surcharge d'une opération de l'API et d'un écran du back-office"
demo_overwrite.module.label: 'Exemple de surcharge'
demo_overwrite.screen.description: "Ce tutoriel explique comment personnaliser l'API et le back-office sans modifier le code de Nathéo. Chaque étape s'appuie sur les fichiers de cet écran."
demo_overwrite.screen.title: 'Exemple de surcharge'
demo_overwrite.tutorial.api_intro: "La surcharge change la classe qui produit la réponse d'une opération. L'opération garde son adresse et ses droits, et les clients de l'API n'ont rien à modifier."
demo_overwrite.tutorial.api_step1_text: "Chaque opération porte un nom unique. Il figure dans le champ `operationId` de la documentation de l'API, et la commande `php bin/console debug:api-resource` affiche les opérations d'une ressource. L'opération de cet exemple s'appelle `info_get`. Les noms des opérations d'administration commencent par `admin_`, comme `admin_module_get`."
demo_overwrite.tutorial.api_step1_title: "Trouver le nom de l'opération"
demo_overwrite.tutorial.api_step2_processor: "Pour une écriture, la classe implémente `ProcessorInterface`. Une écriture d'administration étend plutôt `AbstractAdminProcessor`, comme les processors de Nathéo, pour garder le contrôle de l'en-tête `If-Match` et le journal des actions."
demo_overwrite.tutorial.api_step2_text: "Créez la classe dans `src/Overwrite/`, ici `src/Overwrite/Api/State/Provider/System/InfoProvider.php`. Elle implémente `ProviderInterface` pour une lecture. Pour garder le comportement d'origine, demandez le provider de Nathéo dans le constructeur. Symfony l'injecte, et votre méthode `provide()` l'appelle puis modifie sa réponse. Ici, elle recopie l'objet `Info` et remplit le champ `extra`."
demo_overwrite.tutorial.api_step2_title: 'Écrire la classe de remplacement'
demo_overwrite.tutorial.api_step3_errors: "En cas d'erreur, la construction du cache s'arrête avec un message. C'est le cas d'une opération inconnue, d'une classe absente, d'une classe qui n'est pas un provider ou un processor de l'API, d'un processor donné à une lecture ou d'un provider donné à une opération qui ne lit pas la ressource."
demo_overwrite.tutorial.api_step3_text: "Ajoutez une entrée sous `overwrite.api` dans `config/cms/overwrite.yaml`, avec le nom de l'opération et la classe sous la clé `provider`, ou `processor` pour une écriture. Le fichier est lu à la construction du cache. En développement, le cache se reconstruit seul après une modification. En production, lancez `php bin/console cache:clear`."
demo_overwrite.tutorial.api_step3_title: 'Déclarer la surcharge'
demo_overwrite.tutorial.api_title: "Surcharger une opération de l'API"
