# Labels posés sur les PR selon les fichiers modifiés (actions/labeler)

PHP:
  - changed-files:
      - any-glob-to-any-file: ["src/**/*.php", "tests/**/*.php", "migrations/**/*.php", "config/**/*.php"]

TypeScript:
  - changed-files:
      - any-glob-to-any-file: ["assets/**/*.ts", "assets/**/*.vue", "tsconfig.json", "vite.config.mts"]

JavaScript:
  - changed-files:
      - any-glob-to-any-file: ["assets/**/*.js"]

Twig:
  - changed-files:
      - any-glob-to-any-file: ["templates/**/*.twig"]

CI:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]

Back:
  - changed-files:
      - any-glob-to-any-file: ["src/**", "config/**", "migrations/**"]

Front:
  - changed-files:
      - any-glob-to-any-file: ["assets/**", "templates/**"]

API:
  - changed-files:
      - any-glob-to-any-file:
          - "src/Controller/Api/**"
          - "src/Service/Api/**"
          - "src/Dto/Api/**"
          - "src/Resolver/Api/**"
          - "src/Utils/Api/**"
