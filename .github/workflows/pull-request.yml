name: Pull request

# pull_request_target : le code de la PR n'est jamais exécuté (pas de checkout),
# ce qui permet d'écrire les labels même pour une PR venant d'un fork.
on:
  pull_request_target:
    branches: [master]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  labels:
    name: Labels selon les fichiers modifiés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0

  conventions:
    name: Conventions (branche, titre, issue liée)
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const errors = [];

            // Maintenance sans issue (montée de version, configuration)
            if (branch.startsWith('maintenance/')) {
              if (!/^maintenance\/[a-z0-9.]+(?:-[a-z0-9.]+)*$/.test(branch)) {
                core.setFailed('Branche « ' + branch + ' » : format attendu maintenance/<slug> (minuscules, chiffres, tirets).');
              }
              return;
            }

            const b = branch.match(/^(bug\/B|feature\/N)-(\d+)-[a-z0-9]+(?:-[a-z0-9]+)*$/);
            const t = pr.title.match(/^(Bug\/B|Feature\/N)-(\d+) \S/);
            const c = (pr.body ?? '').match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?) #(\d+)\b/i);

            if (!b) errors.push('Branche « ' + branch + ' » : format attendu bug/B-<n>-<slug>, feature/N-<n>-<slug> ou maintenance/<slug>.');
            if (!t) errors.push('Titre « ' + pr.title + ' » : format attendu « Bug/B-<n> Titre » ou « Feature/N-<n> Titre ».');
            if (!c) errors.push('Description : ajouter « Closes #<n> » pour lier la PR à son issue.');
            if (b && t && b[1].toLowerCase() !== t[1].toLowerCase()) errors.push('Le préfixe du titre ne correspond pas à celui de la branche.');
            if (b && t && b[2] !== t[2]) errors.push('Le numéro du titre (#' + t[2] + ') ne correspond pas à celui de la branche (#' + b[2] + ').');
            if (b && c && b[2] !== c[1]) errors.push('« Closes #' + c[1] + ' » ne correspond pas au numéro de la branche (#' + b[2] + ').');

            const number = Number(c?.[1] ?? b?.[2] ?? t?.[2] ?? 0);
            if (number) {
              try {
                const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number });
                if (issue.pull_request) {
                  errors.push('#' + number + ' est une pull request, pas une issue.');
                } else {
                  const issueLabels = issue.labels.map((l) => (typeof l === 'string' ? l : l.name));
                  const isBug = issueLabels.some((l) => ['type: bug', 'type: régression', 'type: sécurité'].includes(l));
                  if (b && (b[1] === 'bug/B') !== isBug) {
                    core.warning('Le type de branche (' + b[1] + ') ne correspond pas au type de l\'issue #' + number + '.');
                  }

                  // L'issue fait foi pour le type, le module, la priorité et le milestone
                  const prLabels = pr.labels.map((l) => l.name);
                  const toCopy = issueLabels.filter((l) => /^(type|module|priorité): /.test(l) && !prLabels.includes(l));
                  if (toCopy.length) {
                    await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: toCopy });
                  }
                  if (!pr.milestone && issue.milestone) {
                    await github.rest.issues.update({
                      ...context.repo,
                      issue_number: pr.number,
                      milestone: issue.milestone.number,
                    });
                  }
                }
              } catch (e) {
                if (e.status !== 404) throw e;
                errors.push("L'issue #" + number + " n'existe pas.");
              }
            }

            if (errors.length) {
              core.setFailed('Conventions non respectées (voir CONTRIBUTING.md) :\n- ' + errors.join('\n- '));
            }
