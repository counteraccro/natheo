# --- Statut ---
- name: "statut: en attente de merge"
  color: "d9332f"
  description: "Branche en attente, ne pas merger"
  from_name: "En attente de merge"
- name: "statut: doublon"
  color: "cfd3d7"
  description: "Existe déjà dans une autre issue ou PR"
  from_name: "duplicate"
- name: "statut: invalide"
  color: "e4e669"
  description: "Ne semble pas correct"
  from_name: "invalid"
- name: "statut: ne sera pas traité"
  color: "ffffff"
  description: "Ne sera pas corrigé"
  from_name: "wontfix"

# --- Communauté (noms reconnus par GitHub, à ne pas renommer) ---
- name: "good first issue"
  color: "7057ff"
  description: "Idéal pour une première contribution"
- name: "help wanted"
  color: "008672"
  description: "Aide bienvenue"

