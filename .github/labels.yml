# Référentiel des labels du dépôt, synchronisé par .github/workflows/labels-sync.yml
# "from_name" renomme un label existant : les issues et PR qui le portent le conservent.

# --- Type (un seul par issue) ---
- name: "type: bug"
  color: "d73a4a"
  description: "Quelque chose ne fonctionne pas"
  from_name: "bug"
- name: "type: audit"
  color: "5319e7"
  description: "Résultat d'audit d'un module : corrections et améliorations"
- name: "type: feature"
  color: "a2eeef"
  description: "Nouvelle fonctionnalité"
  from_name: "enhancement"
- name: "type: évolution"
  color: "bfdd79"
  description: "Amélioration de l'existant"
  from_name: "Evolution"
- name: "type: clean code"
  color: "f0b7fb"
  description: "Nettoyage, refactoring, suppression de code mort, performance"
  from_name: "Clean code"
- name: "type: régression"
  color: "d93f0b"
  description: "Régression apparue suite à une mise à jour"
  from_name: "Regression"
- name: "type: dépréciation"
  color: "fbd55f"
  description: "Suppression d'une dépréciation"
  from_name: "Deprecation"
- name: "type: documentation"
  color: "0075ca"
  description: "Documentation"
  from_name: "documentation"
- name: "type: sécurité"
  color: "ee0701"
  description: "Correctif de sécurité (détails dans l'advisory, voir SECURITY.md)"
- name: "type: dépendances"
  color: "0366d6"
  description: "Mise à jour de dépendances"
  from_name: "dependencies"
- name: "type: epic"
  color: "a8424f"
  description: "Regroupe plusieurs issues"
  from_name: "Epic"
- name: "type: question"
  color: "d876e3"
  description: "Demande d'information"
  from_name: "question"

# --- Priorité ---
- name: "priorité: critique"
  color: "b60205"
  description: "Faille, perte de données ou blocage : à traiter en premier"
- name: "priorité: medium"
  color: "fbca04"
  description: "Anomalie gênante ou fonctionnalité attendue"
- name: "priorité: bas"
  color: "0e8a16"
  description: "Amélioration mineure"

# --- Couche ---
- name: "couche: back"
  color: "025b5a"
  description: "Développement back (PHP, Symfony)"
  from_name: "Back"
- name: "couche: front"
  color: "57e223"
  description: "Développement front (Vue, TypeScript, Twig)"
  from_name: "Front"
- name: "couche: api"
  color: "8f8cfd"
  description: "API JSON"
  from_name: "API"

# --- Technologie (posé automatiquement sur les PR selon les fichiers modifiés) ---
- name: "tech: php"
  color: "45229e"
  description: "Code PHP"
  from_name: "php"
- name: "tech: typescript"
  color: "a1ce39"
  description: "Code TypeScript / Vue"
  from_name: "TypeScript"
- name: "tech: javascript"
  color: "168700"
  description: "Code JavaScript"
  from_name: "javascript"
- name: "tech: twig"
  color: "bfd4f2"
  description: "Templates Twig"
- name: "tech: ci"
  color: "ededed"
  description: "GitHub Actions, configuration du dépôt"

