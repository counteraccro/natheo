option_system:
    OS_SITE_NAME:
        key: 'OS_SITE_NAME'
        value: 'Nathéo CMS'
    OS_OPEN_SITE:
        key: 'OS_OPEN_SITE'
        value: '1'
    OS_FRONT_SCRIPT_TOP:
        key: 'OS_FRONT_SCRIPT_TOP'
        value: |
            <script>
              window.natheoDemo = { scripts: ['head'] };
              console.info('[Nathéo démo] Script de la balise HEAD exécuté');
            </script>
    OS_FRONT_SCRIPT_START_BODY:
        key: 'OS_FRONT_SCRIPT_START_BODY'
        value: |
            <script>
              (window.natheoDemo = window.natheoDemo || { scripts: [] }).scripts.push('body-start');
              console.info('[Nathéo démo] Script du début de la balise BODY exécuté');
            </script>
    OS_FRONT_SCRIPT_END_BODY:
        key: 'OS_FRONT_SCRIPT_END_BODY'
        value: |
            <script>
              (function () {
                var demo = (window.natheoDemo = window.natheoDemo || { scripts: [] });
                demo.scripts.push('body-end');
                console.info('[Nathéo démo] Script de la fin de la balise BODY exécuté');

                var texts = {
                  fr: { message: 'scripts de démonstration exécutés après votre accord :', close: 'Fermer', head: 'HEAD', 'body-start': 'début du BODY', 'body-end': 'fin du BODY' },
                  en: { message: 'demo scripts ran after your consent:', close: 'Close', head: 'HEAD', 'body-start': 'start of BODY', 'body-end': 'end of BODY' },
                  es: { message: 'scripts de demostración ejecutados tras su aceptación:', close: 'Cerrar', head: 'HEAD', 'body-start': 'inicio del BODY', 'body-end': 'final del BODY' }
                };
                var t = texts[(document.documentElement.lang || 'fr').slice(0, 2)] || texts.fr;

                var box = document.createElement('div');
                box.setAttribute('role', 'status');
                box.style.cssText = 'position:fixed;left:20px;right:20px;bottom:20px;margin-left:auto;z-index:2147483647;max-width:22rem;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:6px;background:#13112a;color:#fff;font:14px/1.5 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.35)';
                var text = document.createElement('p');
                text.style.margin = '0';
                var close = document.createElement('button');
                close.type = 'button';
                close.textContent = '×';
                close.setAttribute('aria-label', t.close);
                close.style.cssText = 'flex:none;min-width:32px;min-height:32px;border:1px solid rgba(255,255,255,.6);border-radius:4px;background:transparent;color:#fff;font-size:18px;line-height:1;cursor:pointer';
                var remove = function () { box.remove(); };
                close.addEventListener('click', remove);
                box.append(text, close);
                document.body.appendChild(box);

                // Texte ajouté après la zone role="status" pour que les lecteurs d'écran l'annoncent
                setTimeout(function () {
                  text.textContent = demo.scripts.length + ' ' + t.message + ' ' + demo.scripts.map(function (s) { return t[s]; }).join(', ') + '.';
                }, 100);
                setTimeout(remove, 8000);
              })();
            </script>
