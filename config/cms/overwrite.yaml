#         - operation: admin_tag_get
#           provider: App\Overwrite\Api\State\Provider\Tag\TagProvider
#         - operation: admin_tag_patch
#           processor: App\Overwrite\Api\State\Processor\Tag\UpdateTagProcessor

overwrite:
    api: []
