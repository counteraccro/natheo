# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true
    http_method_override: false
    handle_all_throwables: true

    profiler: ~

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    #esi: true
    #fragments: true
    php_errors:
        log: true

    rate_limiter:
        # Limite les tentatives d'authentification utilisateur via l'API (clé : IP + login)
        api_auth_user:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
        # Anti-spam sur l'ajout de commentaires via l'API (clé : IP du visiteur transmise par le front)
        api_add_comment:
            policy: 'sliding_window'
            limit: 5
            interval: '10 minutes'

when@test:
    framework:
        test: true
        profiler:
            enabled: true
            collect: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        mailer:
            dsn: 'null://null'
